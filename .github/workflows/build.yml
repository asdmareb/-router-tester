name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o *.zip || true
          mv RouterTester*/* . 2>/dev/null || true
          rm -rf RouterTester* *.zip 2>/dev/null || true
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew assembleDebug; else gradle wrapper && ./gradlew assembleDebug; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: router-tester-apk
          path: app/build/outputs/apk/debug/*.apk
